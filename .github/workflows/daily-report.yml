# Daily Content Agent report — runs the full pipeline in the cloud.
#
# Setup (one time):
#   In your GitHub repo → Settings → Secrets and variables → Actions,
#   add these repository secrets:
#     APIFY_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#
# The schedule below is in UTC. 03:30 UTC ≈ 09:00 IST.
# Runs twice a week (Mon & Thu) to conserve Apify credit.
# Trigger it manually anytime from the Actions tab (workflow_dispatch).
#
# Each run: scrape → Telegram report → commit refreshed dashboard/data.json →
# dispatch the Pages build so the public dashboard updates automatically.

name: Content Agent Report

on:
  schedule:
    - cron: '30 3 * * 1,4'
  workflow_dispatch:
    inputs:
      skip_scrape:
        description: 'Skip the Apify scrape (report from committed data only)'
        type: boolean
        default: false

# Needs to commit the refreshed data.json back and dispatch the Pages build.
permissions:
  contents: write
  actions: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run daily pipeline
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USERNAME: builtbyruturaj
          IG_COMPETITORS: ai.noobstoninjas,vaibhavsisinty,jerrythewebdev,gayatri.tech,web.love.ed
        run: |
          if [ "${{ inputs.skip_scrape }}" = "true" ]; then
            npm run automate -- --skip-scrape
          else
            npm run automate
          fi

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "data.json unchanged — nothing to publish."
          else
            git commit -m "chore: refresh dashboard data (automated)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A GITHUB_TOKEN push does not trigger other workflows, so dispatch the
      # Pages build explicitly to refresh the public dashboard.
      - name: Publish dashboard to Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
